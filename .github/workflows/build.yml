name: Build (1.20.1 Forge)

on:
  push:
    branches:
      - forge-1.20.1
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Check runtime mods (ManaitaPlusGeneral / ManaitaPlus Legacy / ManaitaMTK)
        if: success() || failure()
        run: ./gradlew resolveRuntimeMods -Pruntime_manaita_mod=all --stacktrace

      - name: Inspect jar
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          echo "== $JAR"
          unzip -p "$JAR" META-INF/MANIFEST.MF
          unzip -p "$JAR" META-INF/mods.toml | head -20
          unzip -l "$JAR" | grep -E "mixin|mods.toml" || true

      # 専用サーバーを起動して、Mixin・登録・まな板mod の読み込みでエラーが出ないか確かめる(起動したら止める)
      # ManaitaPlusGeneral 3.0.1 (1.20.1 Forge) は専用サーバーでは起動しない(まな板mod 側の問題)ので、ここでは Legacy と MTK で確かめる
      - name: Smoke test (dedicated server)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          result=0
          for mod in legacy mtk; do
            echo "=================== runtime_manaita_mod=$mod"
            rm -rf run/world
            ./gradlew runServer -Pruntime_manaita_mod=$mod > server-$mod.log 2>&1 &
            started=false
            for i in $(seq 1 120); do
              if grep -q 'Done (' server-$mod.log; then started=true; break; fi
              if grep -qE 'Crash report saved|Failed to start|BUILD FAILED|FAILURE:' server-$mod.log; then break; fi
              sleep 5
            done
            pkill -f 'GradleWrapperMain|forgeserveruserdev' || true
            sleep 5
            grep -E "\[Applied Manaita\]|appliedmanaita|InvalidInjection|Mixin.*(error|fail)|ERROR|Done \(" server-$mod.log | grep -v "DEBUG" | head -60 || true
            if [ "$started" != true ]; then echo "!! server did not start with $mod"; tail -60 server-$mod.log; result=1; fi
          done
          exit $result

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appliedmanaita-1.20.1
          path: build/libs/*.jar
