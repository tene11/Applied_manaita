name: Build (1.21.1 NeoForge)

on:
  push:
    branches:
      - neoforge-1.21.1
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Check runtime mods (ManaitaPlusGeneral / ManaitaPlus Legacy)
        run: ./gradlew resolveRuntimeMods -Pruntime_manaita_mod=both --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appliedmanaita-1.21.1
          path: build/libs/*.jar
