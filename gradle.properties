# Gradle の設定
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# パラメーター名(Parchment)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
loader_version_range=[1,)

# ---------------------------------------------------------------- 前提mod
# AE2 19.2.18 (Modrinth のバージョンID)。https://modrinth.com/mod/ae2/version/KDnFUmMm
ae2_modrinth_version=KDnFUmMm
# AE2 が使う GuideME 21.1.17 (Modrinth のバージョンID)。https://modrinth.com/mod/guideme/version/rduAfwb7
guideme_modrinth_version=rduAfwb7
# mods.toml に書く AE2 のバージョン範囲
ae2_version_range=[19.2.0,)

# レシピ表示mod
jei_version=19.27.0.340
emi_version=1.1.22+1.21.1
# 開発環境(runClient)で動かすレシピ表示mod: emi / jei / both / none
# AE2 1.21.1 は EMI からのレシピ転送には対応していますが、JEI からの転送には対応していません
runtime_itemlist_mod=emi

# ---------------------------------------------------------------- このmod
mod_id=appliedmanaita
mod_name=Applied Manaita
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=dev.manaita.appliedmanaita
mod_authors=tene11
