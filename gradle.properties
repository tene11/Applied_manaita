# Gradle の設定
# Minecraft の逆コンパイルに必要なので、メモリを多めにする
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
# マッピング(Mojang の公式の名前)
mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------- 前提mod
# AE2 15.4.12 (AE2 の配布元 modmaven.dev から取ってくる)
ae2_version=15.4.12
# AE2 15.4 が必要とする GuideME (Maven Central)
guideme_version=20.1.7
# mods.toml に書く AE2 のバージョン範囲
ae2_version_range=[15.0.0,)

# 開発環境(runClient)で動かすまな板mod: general / legacy / mtk / all / none
#   general: ManaitaPlusGeneral   legacy: ManaitaPlus Legacy   mtk: ManaitaMTK   all: 3つとも(倍率は ManaitaPlusGeneral のものを使う)
#   general,legacy のように、カンマで区切って複数選ぶこともできる
runtime_manaita_mod=general

# まな板mod ManaitaPlusGeneral 3.0.1 (Forge 1.20.1) (CurseForge のプロジェクトIDとファイルID。CurseMaven で取ってくる)
# ファイルIDは、CurseForge のファイルのページの URL の最後の数字(…/files/1234567 の 1234567)
manaita_curse_project=1525979
manaita_curse_file=9306387
# ManaitaPlusGeneral が必要とする Architectury API (Modrinth のバージョン番号)
architectury_modrinth_version=9.2.14+forge
# まな板mod ManaitaPlus Legacy (Modrinth のバージョン番号)
legacy_modrinth_version=2.0.5
# まな板mod ManaitaMTK (Modrinth のバージョン番号)
mtk_modrinth_version=1.7.4

# レシピ表示mod (AE2 1.20.1 は JEI・EMI のどちらからでもレシピを転送できる)
jei_version=15.20.0.106
emi_version=1.1.22+1.20.1
# 開発環境(runClient)で動かすレシピ表示mod: emi / jei / both / none
runtime_itemlist_mod=jei

# ---------------------------------------------------------------- このmod
mod_id=appliedmanaita
mod_name=Applied Manaita
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=dev.manaita.appliedmanaita
mod_authors=tene11
