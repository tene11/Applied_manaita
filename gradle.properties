# Gradle の設定
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# パラメーター名(Parchment)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265
loader_version_range=[1,)

# ---------------------------------------------------------------- 前提mod
# AE2 19.2.18 (Modrinth のバージョンID)。https://modrinth.com/mod/ae2/version/KDnFUmMm
ae2_modrinth_version=KDnFUmMm
# AE2 が使う GuideME 21.1.17 (Modrinth のバージョンID)。https://modrinth.com/mod/guideme/version/rduAfwb7
guideme_modrinth_version=rduAfwb7
# mods.toml に書く AE2 のバージョン範囲
ae2_version_range=[19.2.0,)

# 開発環境(runClient)で動かすまな板mod: general / legacy / both / none
#   general: ManaitaPlusGeneral   legacy: ManaitaPlus Legacy   both: 両方(倍率は ManaitaPlusGeneral のものを使う)
runtime_manaita_mod=general

# まな板mod ManaitaPlusGeneral (CurseForge のプロジェクトIDとファイルID。CurseMaven で取ってくる)
# ファイルIDは、CurseForge のファイルのページの URL の最後の数字(…/files/1234567 の 1234567)
manaita_curse_project=1525979
manaita_curse_file=8663703
# ManaitaPlusGeneral 3.0 が必要とする Architectury API 13.0.11 (Modrinth のバージョンID)
# https://modrinth.com/mod/architectury-api/version/13.0.11+neoforge
architectury_modrinth_version=1IiqEQGl
# まな板mod ManaitaPlus Legacy 0.1.1.1 (Modrinth のバージョンID)
# https://modrinth.com/mod/manaitaplus-legacy/version/dKV1jmAR
legacy_modrinth_version=dKV1jmAR

# 開発環境(runClient)で使う便利mod: Mouse Tweaks 2.26.1 (Modrinth のバージョンID)
# https://modrinth.com/mod/mouse-tweaks/version/9I21YYxf
mousetweaks_modrinth_version=9I21YYxf
# Iris と Sodium を開発環境に入れるか(true / false)。ManaitaPlus Legacy を動かすときに必要
runtime_iris=true
# Iris 1.8.14-beta.1 (ManaitaPlus Legacy が必要とする) と、Iris が必要とする Sodium 0.8.13 (Modrinth のバージョンID)
# https://modrinth.com/mod/iris/version/KduFYu4t
# https://modrinth.com/mod/sodium/version/uMOpc5uV
iris_modrinth_version=KduFYu4t
sodium_modrinth_version=uMOpc5uV

# レシピ表示mod
jei_version=19.27.0.340
emi_version=1.1.22+1.21.1
# 開発環境(runClient)で動かすレシピ表示mod: emi / jei / both / none
# AE2 1.21.1 は EMI からのレシピ転送には対応していますが、JEI からの転送には対応していません
runtime_itemlist_mod=jei

# ---------------------------------------------------------------- このmod
mod_id=appliedmanaita
mod_name=Applied Manaita
mod_license=LGPL-3.0-or-later
mod_version=1.0.0
mod_group_id=dev.manaita.appliedmanaita
mod_authors=tene11
