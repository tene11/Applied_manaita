modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/tene11/Applied_manaita/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/tene11/Applied_manaita"
description='''
まな板mod (ManaitaPlusGeneral / ManaitaPlus Legacy) の「倍化」を AE2 の自動クラフトで使えるようにするアドオンです。
Brings Manaita mod (ManaitaPlusGeneral / ManaitaPlus Legacy) "doubling" to AE2 autocrafting.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

# まな板mod はどちらか一方が必要(どちらもないときは、このmodが起動時にメッセージを出して止める)
[[dependencies.${mod_id}]]
    modId="manaita_plus_general"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="manaita_plus_legacy"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
