modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/tene11/Applied_manaita/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/tene11/Applied_manaita"
description='''
まな板mod (ManaitaPlusGeneral / ManaitaPlus Legacy / ManaitaMTK) の「倍化」を AE2 の自動クラフトで使えるようにするアドオンです。
Brings Manaita mod (ManaitaPlusGeneral / ManaitaPlus Legacy / ManaitaMTK) "doubling" to AE2 autocrafting.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    mandatory=true
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"

# まな板mod はどれか1つが必要(どれもないときは、このmodが起動時にメッセージを出して止める)
[[dependencies.${mod_id}]]
    modId="manaita_plus_general"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="manaita_plus_legacy"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="manaitamtk"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
